<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="/assets/site.css">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #ffa569; }

    .brand img { width: 92px; height: 92px; }
    .brand b { font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 600; font-size: 46px; line-height: 1.02; color: #ffffff; letter-spacing: -0.01em; }
    h1 { font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 600; font-size: 58px; line-height: 1.12; color: #1f1208; margin: 0; max-width: 940px; letter-spacing: -0.01em; }
    .foot { font-family: "Bricolage Grotesque", Arial, sans-serif; font-size: 26px; font-weight: 600; color: #1f1208; opacity: 0.75; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="brand"><img src="/assets/logo-mark.svg" alt=""><b>KRES<br>Solutions</b></div>
    <h1>We keep your company's Microsoft 365 and cloud accounts secure.</h1>
    <div class="foot">kressolutions.com</div>
  </div>
</body>
</html>
