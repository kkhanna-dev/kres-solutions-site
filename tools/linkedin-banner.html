<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>LinkedIn banner source (1128 x 191)</title>
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    html, body { margin: 0; width: 1128px; height: 191px; overflow: hidden; background: #0f1518; }
    .b { position: absolute; inset: 0; background: radial-gradient(520px 260px at 92% 40%, rgba(255,165,105,0.16), transparent 70%); border-bottom: 4px solid #ffa569; }
    .t { position: absolute; right: 56px; top: 50%; transform: translateY(-50%); text-align: right; }
    .t h1 { font-family: "Public Sans", Arial, sans-serif; font-weight: 600; font-size: 30px; line-height: 1.15; color: #eef2f3; margin: 0; letter-spacing: -0.01em; }
    .t p { font-family: "Public Sans", Arial, sans-serif; font-size: 15px; color: #8b989e; margin: 10px 0 0; }
    .t p b { color: #ffa569; font-weight: 600; }
  </style>
</head>
<body>
  <div class="b"></div>
  <div class="t">
    <h1>We keep your company's Microsoft 365<br>and cloud accounts secure.</h1>
    <p>Cybersecurity for small and mid-sized businesses &middot; <b>kressolutions.com</b></p>
  </div>
</body>
</html>
